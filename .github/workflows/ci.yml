name: ci

# The devkit's reusable workflows at the pinned tag (MIP-0070 §5.6). Bump the tag here, the
# devkit-ref inputs, flake.nix's input and .claude/settings.json's marketplace ref together.

on:
  pull_request:
  push:
    branches: [main]
  # refresh.yml dispatches CI on its rolling PR (#14).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: marola-dev/marola-devkit/.github/workflows/python-ci.yml@v0.13.0
    with:
      self-test-commands: |
        python3 scripts/refresh.py --self-test
        for f in data/*.json; do python3 -m json.tool "$f" > /dev/null; done
        git -c advice.detachedHead=false clone -q --depth 1 -b v0.13.0 https://github.com/marola-dev/marola-devkit /tmp/devkit && python3 /tmp/devkit/scripts/docs_lint.py .

  agents:
    uses: marola-dev/marola-devkit/.github/workflows/agents-check.yml@v0.13.0
    with:
      devkit-ref: v0.13.0

  # A job added later must join needs:, or ci-rule stops covering it.
  ci-ok:
    if: always()
    needs: [python, agents]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: every needed job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a needed job ended $r"; exit 1 ;; esac
          done
