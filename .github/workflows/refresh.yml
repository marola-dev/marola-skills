name: refresh

# Rebuilds data/index.json and docs/4-reference_index.md from GitHub, with no model calls, and keeps
# one rolling PR on chore/skills-refresh when anything changed.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency: refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Writes as marola-pr-bot (MIP-0086): this org lets no GITHUB_TOKEN open a PR (#32), and a PR the
    # App opens starts ci.yml itself.
    permissions:
      contents: read
    env:
      BRANCH: chore/skills-refresh
    steps:
      - id: bot
        uses: marola-dev/marola-devkit/.github/actions/bot-token@v0.20.3
        with:
          app-id: ${{ vars.PR_BOT_APP_ID }}
          private-key: ${{ secrets.PR_BOT_KEY }}
          repositories: marola-skills
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.bot.outputs.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/refresh.py | tee -a "$GITHUB_STEP_SUMMARY"
          [ -z "$(git status --porcelain)" ] || echo "changed=true" >> "$GITHUB_OUTPUT"
      - if: steps.run.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          git switch -C "$BRANCH"
          git add data docs README.md
          git commit -qm "chore: refresh the skills index" \
            -m "Tested: scripts/refresh.py" \
            -m "Co-Authored-By: Claude <noreply@anthropic.com>"
          git push --force origin "$BRANCH"
          body="$(sed -n '/^## Waiting for review/,/^## Own/p' docs/4-reference_index.md | sed '$d')"
          pr="$(gh pr list --head "$BRANCH" --base main --state open --json number -q '.[0].number // empty')"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body "$body"
          else
            gh pr create --head "$BRANCH" --base main --title "chore: refresh the skills index" --body "$body"
          fi
